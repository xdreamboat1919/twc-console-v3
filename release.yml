name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Package
        run: |
          cp docs/RUNNING.md dist/README.md
          tar -czf console-${{ github.ref_name }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: console-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
